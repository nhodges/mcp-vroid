[project]
name = "mcp-vroid"
version = "0.1.0"
description = "Drive VRoid Studio from any MCP client - GUI automation with OCR and injected input, on Wayland (Hyprland) or Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nuri Hodges" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "vroid",
    "vrm",
    "gui-automation",
    "hyprland",
    "wayland",
    "windows",
    "3d",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.2",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "python-xlib>=0.33",
    "winrt-runtime>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-globalization>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.0 ; sys_platform == 'win32'",
]

[project.scripts]
mcp-vroid = "mcp_vroid.server:main"
vroid-driver = "mcp_vroid.driver.cli:main"

[project.urls]
Homepage = "https://github.com/nhodges/mcp-vroid"
Repository = "https://github.com/nhodges/mcp-vroid"
Issues = "https://github.com/nhodges/mcp-vroid/issues"
Changelog = "https://github.com/nhodges/mcp-vroid/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vroid"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
